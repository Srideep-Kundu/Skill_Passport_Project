services:
  - type: keyvalue
    name: skill-passport-key-value
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: skill-passport-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    preDeployCommand: alembic upgrade head
    numInstances: 1
    disk:
      name: skill-passport-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_RESET_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: skill-passport-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: skill-passport-key-value
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: INSTITUTION_REGISTRATION_ALLOWLIST
        sync: false
      - key: RATE_LIMITING_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EXTRACTION_PROVIDER
        value: groq
      - key: EXTRACTION_MODEL
        value: gemini-3.6-flash
      - key: GROQ_EXTRACTION_MODEL
        value: openai/gpt-oss-20b
      - key: COHERE_EXTRACTION_MODEL
        value: command-a-03-2025
      - key: OPENROUTER_EXTRACTION_MODEL
        value: openai/gpt-oss-120b
      - key: EXTRACTION_FALLBACK_PROVIDERS
        value: gemini,local
      - key: HF_EXTRACTION_ENABLED
        value: "false"
      - key: HF_EXTRACTION_ENDPOINT
        sync: false
      - key: HF_EXTRACTION_API_KEY
        sync: false
      - key: HF_EXTRACTION_MODEL
        value: microsoft/Phi-4-mini-instruct
      - key: EXTRACTION_RAG_ENABLED
        value: "true"
      - key: EXTRACTION_RAG_TOP_K
        value: "8"
      - key: EXTRACTION_RAG_MIN_SIMILARITY
        value: "0.72"
      - key: EXTRACTION_CACHE_ENABLED
        value: "true"
      - key: EXTRACTION_BATCH_MAX_UNITS
        value: "12"
      - key: EXTRACTION_BATCH_MAX_CHARACTERS
        value: "12000"
      - key: EXTRACTION_SCHEMA_VERSION
        value: v2-hybrid-batch
      - key: EXTRACTION_SYNC_FALLBACK
        value: "false"
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSION
        value: "768"
      - key: SEMANTIC_MATCHING_ENABLED
        value: "false"
      - key: SEMANTIC_SIMILARITY_THRESHOLD
        value: "0.75"
      - key: GITHUB_TOKEN
        sync: false
      - key: GREENHOUSE_BOARD_TOKENS
        sync: false
      - key: LEVER_SITE_TOKENS
        sync: false
      - key: ASHBY_JOB_BOARD_NAMES
        sync: false
      - key: YC_SOURCE_KEYS
        value: yc_startups
      - key: RESUME_STORAGE_DIR
        value: /app/uploads/resumes
      - key: LINKEDIN_STORAGE_DIR
        value: /app/uploads/linkedin
      - key: RESUME_MAX_UPLOAD_BYTES
        value: "5242880"
      - key: RESUME_MAX_EXTRACTED_CHARACTERS
        value: "100000"
      - key: LINKEDIN_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: PROVIDER_SUBMISSION_ENABLED
        value: "false"
      - key: LEVER_SUBMISSION_ENABLED
        value: "false"
      - key: APPLICATION_EXECUTION_MODE
        value: assisted

  - type: worker
    name: skill-passport-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m app.workers.extraction_worker
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: skill-passport-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: skill-passport-key-value
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EXTRACTION_PROVIDER
        value: groq
      - key: EXTRACTION_MODEL
        value: gemini-3.6-flash
      - key: GROQ_EXTRACTION_MODEL
        value: openai/gpt-oss-20b
      - key: COHERE_EXTRACTION_MODEL
        value: command-a-03-2025
      - key: OPENROUTER_EXTRACTION_MODEL
        value: openai/gpt-oss-120b
      - key: EXTRACTION_FALLBACK_PROVIDERS
        value: gemini,local
      - key: HF_EXTRACTION_ENABLED
        value: "false"
      - key: HF_EXTRACTION_ENDPOINT
        sync: false
      - key: HF_EXTRACTION_API_KEY
        sync: false
      - key: HF_EXTRACTION_MODEL
        value: microsoft/Phi-4-mini-instruct
      - key: EXTRACTION_RAG_ENABLED
        value: "true"
      - key: EXTRACTION_RAG_TOP_K
        value: "8"
      - key: EXTRACTION_RAG_MIN_SIMILARITY
        value: "0.72"
      - key: EXTRACTION_CACHE_ENABLED
        value: "true"
      - key: EXTRACTION_BATCH_MAX_UNITS
        value: "12"
      - key: EXTRACTION_BATCH_MAX_CHARACTERS
        value: "12000"
      - key: EXTRACTION_SCHEMA_VERSION
        value: v2-hybrid-batch
      - key: EXTRACTION_MAX_ATTEMPTS
        value: "3"
      - key: EXTRACTION_RETRY_BASE_SECONDS
        value: "15"
      - key: EXTRACTION_RETRY_MAX_SECONDS
        value: "300"
      - key: EXTRACTION_CLAIM_TIMEOUT_SECONDS
        value: "300"
      - key: WORKER_HEARTBEAT_TTL_SECONDS
        value: "30"
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSION
        value: "768"
      - key: GITHUB_TOKEN
        sync: false
      - key: GREENHOUSE_BOARD_TOKENS
        sync: false
      - key: LEVER_SITE_TOKENS
        sync: false
      - key: ASHBY_JOB_BOARD_NAMES
        sync: false
      - key: YC_SOURCE_KEYS
        value: yc_startups

databases:
  - name: skill-passport-db
    plan: basic-256mb
    region: singapore
    databaseName: skill_passport
    user: skill_passport
    postgresMajorVersion: "16"
    ipAllowList: []
