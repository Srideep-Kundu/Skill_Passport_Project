name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests, lint, and type checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: skill_passport_test
          POSTGRES_USER: skill_passport
          POSTGRES_PASSWORD: test-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skill_passport -d skill_passport_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://skill_passport:test-password-only@localhost:5432/skill_passport_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET_KEY: test-only-not-a-production-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies in an isolated environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Verify database migrations
        working-directory: backend
        run: |
          . ../.venv/bin/activate
          python -m alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: |
          . ../.venv/bin/activate
          python -m pytest
      - name: Lint backend
        run: |
          . .venv/bin/activate
          python -m ruff check backend
      - name: Type-check backend
        run: |
          . .venv/bin/activate
          python -m mypy backend/app

  frontend:
    name: Frontend tests, lint, type checks, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
      - name: Install Chromium for browser acceptance test
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance test
        working-directory: frontend
        run: npm run test:e2e

  compose:
    name: Compose configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet
