name: skill-passport

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skill_passport}
      POSTGRES_USER: ${POSTGRES_USER:-skill_passport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://skill_passport:change-me-local-only@postgres:5432/skill_passport}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://skill_passport:change-me-local-only@postgres:5432/skill_passport}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-local}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gemini-3.6-flash}
      GROQ_EXTRACTION_MODEL: ${GROQ_EXTRACTION_MODEL:-openai/gpt-oss-20b}
      COHERE_EXTRACTION_MODEL: ${COHERE_EXTRACTION_MODEL:-command-a-03-2025}
      OPENROUTER_EXTRACTION_MODEL: ${OPENROUTER_EXTRACTION_MODEL:-openai/gpt-oss-120b}
      EXTRACTION_FALLBACK_PROVIDERS: ${EXTRACTION_FALLBACK_PROVIDERS:-}
      HF_EXTRACTION_ENABLED: ${HF_EXTRACTION_ENABLED:-false}
      HF_EXTRACTION_ENDPOINT: ${HF_EXTRACTION_ENDPOINT:-}
      HF_EXTRACTION_MODEL: ${HF_EXTRACTION_MODEL:-microsoft/Phi-4-mini-instruct}
      HF_EXTRACTION_API_KEY: ${HF_EXTRACTION_API_KEY:-}
      HF_EXTRACTION_TIMEOUT_SECONDS: ${HF_EXTRACTION_TIMEOUT_SECONDS:-30}
      EXTRACTION_RAG_ENABLED: ${EXTRACTION_RAG_ENABLED:-true}
      EXTRACTION_RAG_TOP_K: ${EXTRACTION_RAG_TOP_K:-8}
      EXTRACTION_RAG_MIN_SIMILARITY: ${EXTRACTION_RAG_MIN_SIMILARITY:-0.72}
      EXTRACTION_CACHE_ENABLED: ${EXTRACTION_CACHE_ENABLED:-true}
      EXTRACTION_BATCH_MAX_UNITS: ${EXTRACTION_BATCH_MAX_UNITS:-12}
      EXTRACTION_BATCH_MAX_CHARACTERS: ${EXTRACTION_BATCH_MAX_CHARACTERS:-12000}
      EXTRACTION_SCHEMA_VERSION: ${EXTRACTION_SCHEMA_VERSION:-v2-hybrid-batch}
      EXTRACTION_SYNC_FALLBACK: ${EXTRACTION_SYNC_FALLBACK:-false}
      EXTRACTION_MAX_ATTEMPTS: ${EXTRACTION_MAX_ATTEMPTS:-3}
      EXTRACTION_RETRY_BASE_SECONDS: ${EXTRACTION_RETRY_BASE_SECONDS:-15}
      EXTRACTION_RETRY_MAX_SECONDS: ${EXTRACTION_RETRY_MAX_SECONDS:-300}
      EXTRACTION_CLAIM_TIMEOUT_SECONDS: ${EXTRACTION_CLAIM_TIMEOUT_SECONDS:-300}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-30}
      RESUME_STORAGE_DIR: ${RESUME_STORAGE_DIR:-/app/uploads/resumes}
      RESUME_MAX_UPLOAD_BYTES: ${RESUME_MAX_UPLOAD_BYTES:-5242880}
      RESUME_MAX_EXTRACTED_CHARACTERS: ${RESUME_MAX_EXTRACTED_CHARACTERS:-100000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      SEMANTIC_MATCHING_ENABLED: ${SEMANTIC_MATCHING_ENABLED:-false}
      SEMANTIC_SIMILARITY_THRESHOLD: ${SEMANTIC_SIMILARITY_THRESHOLD:-0.75}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SKILL_PASSPORT_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      INSTITUTION_REGISTRATION_ALLOWLIST: ${INSTITUTION_REGISTRATION_ALLOWLIST:-}
      LINKEDIN_STORAGE_DIR: ${LINKEDIN_STORAGE_DIR:-/app/uploads/linkedin}
      LINKEDIN_MAX_UPLOAD_BYTES: ${LINKEDIN_MAX_UPLOAD_BYTES:-10485760}
      RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      REGISTRATION_RATE_LIMIT_PER_MINUTE: ${REGISTRATION_RATE_LIMIT_PER_MINUTE:-5}
      EXTRACTION_RATE_LIMIT_PER_MINUTE: ${EXTRACTION_RATE_LIMIT_PER_MINUTE:-10}
      VERIFICATION_RATE_LIMIT_PER_MINUTE: ${VERIFICATION_RATE_LIMIT_PER_MINUTE:-10}
      EXTERNAL_JOB_SYNC_RATE_LIMIT_PER_MINUTE: ${EXTERNAL_JOB_SYNC_RATE_LIMIT_PER_MINUTE:-5}
      DISCOVERY_RUN_RATE_LIMIT_PER_MINUTE: ${DISCOVERY_RUN_RATE_LIMIT_PER_MINUTE:-10}
      APPLICATION_EXECUTION_RATE_LIMIT_PER_MINUTE: ${APPLICATION_EXECUTION_RATE_LIMIT_PER_MINUTE:-10}
      MIN_EXTERNAL_JOB_MATCH_SCORE: ${MIN_EXTERNAL_JOB_MATCH_SCORE:-0.2}
      GREENHOUSE_BOARD_TOKENS: ${GREENHOUSE_BOARD_TOKENS:-}
      LEVER_SITE_TOKENS: ${LEVER_SITE_TOKENS:-}
      ASHBY_JOB_BOARD_NAMES: ${ASHBY_JOB_BOARD_NAMES:-}
      YC_SOURCE_KEYS: ${YC_SOURCE_KEYS:-yc_startups}
      DISCOVERY_MAX_ACTIVE_PER_STUDENT: ${DISCOVERY_MAX_ACTIVE_PER_STUDENT:-10}
      GREENHOUSE_APPLICATION_CREDENTIALS: ${GREENHOUSE_APPLICATION_CREDENTIALS:-}
      LEVER_APPLICATION_CREDENTIALS: ${LEVER_APPLICATION_CREDENTIALS:-}
      PROVIDER_SUBMISSION_ENABLED: ${PROVIDER_SUBMISSION_ENABLED:-false}
      LEVER_SUBMISSION_ENABLED: ${LEVER_SUBMISSION_ENABLED:-false}
      APPLICATION_EXECUTION_MODE: ${APPLICATION_EXECUTION_MODE:-assisted}
    ports:
      - "8000:8000"
    volumes:
      - upload-data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://skill_passport:change-me-local-only@postgres:5432/skill_passport}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-local}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gemini-3.6-flash}
      GROQ_EXTRACTION_MODEL: ${GROQ_EXTRACTION_MODEL:-openai/gpt-oss-20b}
      COHERE_EXTRACTION_MODEL: ${COHERE_EXTRACTION_MODEL:-command-a-03-2025}
      OPENROUTER_EXTRACTION_MODEL: ${OPENROUTER_EXTRACTION_MODEL:-openai/gpt-oss-120b}
      EXTRACTION_FALLBACK_PROVIDERS: ${EXTRACTION_FALLBACK_PROVIDERS:-}
      HF_EXTRACTION_ENABLED: ${HF_EXTRACTION_ENABLED:-false}
      HF_EXTRACTION_ENDPOINT: ${HF_EXTRACTION_ENDPOINT:-}
      HF_EXTRACTION_MODEL: ${HF_EXTRACTION_MODEL:-microsoft/Phi-4-mini-instruct}
      HF_EXTRACTION_API_KEY: ${HF_EXTRACTION_API_KEY:-}
      HF_EXTRACTION_TIMEOUT_SECONDS: ${HF_EXTRACTION_TIMEOUT_SECONDS:-30}
      EXTRACTION_RAG_ENABLED: ${EXTRACTION_RAG_ENABLED:-true}
      EXTRACTION_RAG_TOP_K: ${EXTRACTION_RAG_TOP_K:-8}
      EXTRACTION_RAG_MIN_SIMILARITY: ${EXTRACTION_RAG_MIN_SIMILARITY:-0.72}
      EXTRACTION_CACHE_ENABLED: ${EXTRACTION_CACHE_ENABLED:-true}
      EXTRACTION_BATCH_MAX_UNITS: ${EXTRACTION_BATCH_MAX_UNITS:-12}
      EXTRACTION_BATCH_MAX_CHARACTERS: ${EXTRACTION_BATCH_MAX_CHARACTERS:-12000}
      EXTRACTION_SCHEMA_VERSION: ${EXTRACTION_SCHEMA_VERSION:-v2-hybrid-batch}
      EXTRACTION_MAX_ATTEMPTS: ${EXTRACTION_MAX_ATTEMPTS:-3}
      EXTRACTION_RETRY_BASE_SECONDS: ${EXTRACTION_RETRY_BASE_SECONDS:-15}
      EXTRACTION_RETRY_MAX_SECONDS: ${EXTRACTION_RETRY_MAX_SECONDS:-300}
      EXTRACTION_CLAIM_TIMEOUT_SECONDS: ${EXTRACTION_CLAIM_TIMEOUT_SECONDS:-300}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-30}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GREENHOUSE_BOARD_TOKENS: ${GREENHOUSE_BOARD_TOKENS:-}
      LEVER_SITE_TOKENS: ${LEVER_SITE_TOKENS:-}
      ASHBY_JOB_BOARD_NAMES: ${ASHBY_JOB_BOARD_NAMES:-}
      YC_SOURCE_KEYS: ${YC_SOURCE_KEYS:-yc_startups}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      DISCOVERY_MAX_ACTIVE_PER_STUDENT: ${DISCOVERY_MAX_ACTIVE_PER_STUDENT:-10}
    command: ["python", "-m", "app.workers.extraction_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  upload-data:
