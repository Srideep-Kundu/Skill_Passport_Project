name: skill-passport

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skill_passport}
      POSTGRES_USER: ${POSTGRES_USER:-skill_passport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://skill_passport:change-me-local-only@postgres:5432/skill_passport}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-long-random-secret}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://skill_passport:change-me-local-only@postgres:5432/skill_passport}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-long-random-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-local}
      EXTRACTION_SYNC_FALLBACK: ${EXTRACTION_SYNC_FALLBACK:-false}
      EXTRACTION_MAX_ATTEMPTS: ${EXTRACTION_MAX_ATTEMPTS:-3}
      EXTRACTION_RETRY_BASE_SECONDS: ${EXTRACTION_RETRY_BASE_SECONDS:-15}
      EXTRACTION_RETRY_MAX_SECONDS: ${EXTRACTION_RETRY_MAX_SECONDS:-300}
      EXTRACTION_CLAIM_TIMEOUT_SECONDS: ${EXTRACTION_CLAIM_TIMEOUT_SECONDS:-300}
      RESUME_STORAGE_DIR: ${RESUME_STORAGE_DIR:-/app/uploads/resumes}
      RESUME_MAX_UPLOAD_BYTES: ${RESUME_MAX_UPLOAD_BYTES:-5242880}
      RESUME_MAX_EXTRACTED_CHARACTERS: ${RESUME_MAX_EXTRACTED_CHARACTERS:-100000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      SEMANTIC_MATCHING_ENABLED: ${SEMANTIC_MATCHING_ENABLED:-false}
      SEMANTIC_SIMILARITY_THRESHOLD: ${SEMANTIC_SIMILARITY_THRESHOLD:-0.75}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      REGISTRATION_RATE_LIMIT_PER_MINUTE: ${REGISTRATION_RATE_LIMIT_PER_MINUTE:-5}
      EXTRACTION_RATE_LIMIT_PER_MINUTE: ${EXTRACTION_RATE_LIMIT_PER_MINUTE:-10}
      VERIFICATION_RATE_LIMIT_PER_MINUTE: ${VERIFICATION_RATE_LIMIT_PER_MINUTE:-10}
    ports:
      - "8000:8000"
    volumes:
      - resume-data:/app/uploads/resumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://skill_passport:change-me-local-only@postgres:5432/skill_passport}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-local}
      EXTRACTION_MAX_ATTEMPTS: ${EXTRACTION_MAX_ATTEMPTS:-3}
      EXTRACTION_RETRY_BASE_SECONDS: ${EXTRACTION_RETRY_BASE_SECONDS:-15}
      EXTRACTION_RETRY_MAX_SECONDS: ${EXTRACTION_RETRY_MAX_SECONDS:-300}
      EXTRACTION_CLAIM_TIMEOUT_SECONDS: ${EXTRACTION_CLAIM_TIMEOUT_SECONDS:-300}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    command: ["python", "-m", "app.workers.extraction_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  resume-data:
